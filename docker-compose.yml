services:
  blog:
    # Image will be dynamically updated during deployment
    # Format: registry.example.com/user/blog:sha_tag
    build: .
    image: blog:latest
    container_name: blog
    # Same as the image HEALTHCHECK. Podman ignores HEALTHCHECK in OCI-format
    # images (what kaniko pushes), and the deploy waits for "healthy".
    healthcheck:
      test: ["CMD-SHELL","wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`blog.asxp.io`)"
      - "traefik.http.routers.blog.entrypoints=websecure"
      - "traefik.http.routers.blog.tls=true"
      - "traefik.http.routers.blog.tls.certresolver=letsencrypt"
      - "traefik.http.services.blog.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
