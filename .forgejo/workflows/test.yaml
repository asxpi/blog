name: Test

on:
  push:
    branches-ignore:
      - main

jobs:
  check:
    runs-on: nix-latest
    # Settings via env, not /etc/nix/nix.conf: in the image that is a
    # symlink into /nix/store, which the runner's nix-store volume
    # shadows, so it dangles once the image moves on.
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        build-users-group =
        sandbox = false
    steps:
      - name: Prepare container for actions
        run: |
          nix-env -iA nixpkgs.nodejs_22

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: nix develop -c zola build
