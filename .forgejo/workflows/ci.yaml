name: CI

# Every push builds the site as the servers will (the flake's package).
# Deploying is not this repository's job: Renovate in asxpi/iac picks up
# each push to main and the servers pull it (comin).

on:
  push:

jobs:
  check:
    runs-on: nix-latest
    # Settings via env, not /etc/nix/nix.conf: in the image that is a
    # symlink into /nix/store, which the runner's nix-store volume
    # shadows, so it dangles once the image moves on.
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        build-users-group =
        sandbox = false
    steps:
      - name: Prepare container for actions
        run: |
          nix-env -iA nixpkgs.nodejs_22

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build site (the package nginx serves)
        run: nix build .#default
